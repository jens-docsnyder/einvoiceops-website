    field: penalty_max
    old_value: "EUR 66,360 for legal entities (non-issuance, NN 89/25 Art. 71(1)(3)); EUR 92,900 for repeated non-compliance (source-verification required for repeated penalty figure)"
    new_value: "EUR 66,360 for legal entities (NN 89/25 Art. 71(1)); EUR 39,810 for self-employed sole traders (NN 89/25 Art. 71(3)). No repeated-violation surcharge found in Art. 71."
    description: "EUR 92,900 repeated penalty claim removed: A check of NN 89/25 Art. 71 found no repeated-violation surcharge. Legal entity range EUR 3,980-66,360 confirmed from Art. 71(1) Croatian text. Sole trader range EUR 3,980-39,810 added from Art. 71(3). Claim was unconfirmed; resolved as not found in the primary source."
