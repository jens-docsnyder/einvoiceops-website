    old_value: "pending verification"
    new_value: "verified"
    description: "All 5 open items resolved via primary source verification. (1) Phase-in date discrepancy resolved: current page correct - VAT-registered Jan 2026, non-VAT sole traders Jan 2027, per NN 89/25 Art. 38. (2) EUR 92,900 repeated penalty confirmed not in Art. 71 - corrected above. (3) Accounting Act 11-year archiving confirmed: NN 85/24 Art. 10 — accessed directly - journal/general ledger documents minimum 11 years. (4) Fiscalization Act 6-year archiving confirmed: NN 89/25 Art. 35(1) - six godina from year-end. (5) Penalty range EUR 3,980-66,360 confirmed from NN 89/25 Art. 71(1). Open items: 3->0 high-priority, 2->0 other, last_verified: 2026-05-06."
