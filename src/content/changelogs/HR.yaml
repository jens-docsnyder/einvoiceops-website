    description: "B2B e-invoicing mandatory: Croatia extended the Fiscalization Act (Zakon o fiskalizaciji u prometu gotovinom) to cover e-invoicing. B2G e-invoicing established. Croatia joined EU 2013; Directive 2014/55/EU transposition completed. Stability: live-stable, mandate fully operational."
