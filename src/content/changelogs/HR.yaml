    description: "Initial publish. Croatia Fiscalization Act NN 89/25 - CTC/real-time reporting model, Phase 1 VAT-registered January 1, 2026, Phase 2 non-VAT-registered January 2027. Source: external source verification (2026-05-05). Items pending verification: phase-in date discrepancy (EC factsheet vs NN 89/25 Art. 38 text), EUR 92,900 repeated penalty (not confirmed in NN 89/25 Art. 71), archiving split 6 years (Fiscalization Act) vs 11 years (Accounting Act). Open items: 3 high-priority, 2 other."
