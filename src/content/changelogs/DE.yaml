  - timestamp: 2026-05-03T00:00:00Z
    type: content-update
    field: "correction_business_continuity.correction"
    old_value: "Correction must be fully compliant EN 16931 invoice; PDF correction to XRechnung not valid (stated without transition period caveat)"
    new_value: "Added transition period caveat: correction must be EN 16931 e-invoice once mandatory phase applies; during transition periods, corrections may still use paper or non-compliant electronic formats where transition rules permit"
    description: "BMF FAQ 2026 confirmed: correction must be e-invoice (§31 Abs. 5 UStDV) when e-invoice obligation applies, with explicit exception during transition periods. Page text updated to reflect this nuance - previous wording overstated the rule for entities still in their transition window."
    source_url: "https://www.bundesfinanzministerium.de/Content/DE/FAQ/e-rechnung.html"
    mandate_version_before: 1
    mandate_version_after: 1
  - timestamp: 2026-05-03T00:00:00Z
    type: confidence-upgrade
    field: "items pending verification"
    old_value: "2"
    new_value: "0"
    description: "First source verification pass (partial). Both pending verification items resolved: (1) EUR 800,000 threshold + §27 Abs. 38 UStG confirmed from Wachstumschancengesetz enacted text (BGBl. 2024 I Nr. 108); (2) correction must be EN 16931 e-invoice confirmed from BMF FAQ 2026. Two high-priority items remain open: (a) financial penalty provisions under §26a UStG / GoBD - no source yet; (b) Rn 35a XML-binding-over-PDF claim in BMF Schreiben Oct 2025 - text found at Rn 35a does not match claim, further search needed. Status stays pending verification."
    source_url: "https://www.recht.bund.de/bgbl/1/2024/108/VO.html"
