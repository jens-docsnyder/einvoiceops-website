country_code: DE
entries:
  - timestamp: 2026-10-15T19:28:10Z
    type: content-update
    field: "preparation_timeline, operational_ownership, data_infrastructure, key_deadlines"
    old_value: "No statement of the EDI exception, the permanent exemptions or the XRechnung version state; the 2027 issuing threshold read as prior-year turnover from domestic B2B transactions"
    new_value: "Added: the 2027 EDI exception (par. 27 Abs. 38 Nr. 3 UStG); the three kinds of invoice that may always go as a sonstige Rechnung (pars. 33, 34, 34a UStDV) with the exclusion for supplies under pars. 3c, 6a and 13b UStG; the XRechnung version state (3.0 in force until at least 31 July 2027, 4.0 pre-release September 2026, final expected spring 2027). The threshold is stated as prior-year total turnover (Gesamtumsatz)."
    description: "Page text brought to the saved statute texts (UStG par. 27 Abs. 38, UStDV pars. 33, 34 and 34a) and the XRechnung versions page of the standard's publisher read on 19 September 2026. Only the sentences named here were rechecked; the rest of the page was not re-verified in this change."
    source_url: "https://www.gesetze-im-internet.de/ustg_1980/__27.html"
    mandate_version_before: 1
    mandate_version_after: 1
  - timestamp: 2026-10-15T19:28:05Z
    type: error-correction
    field: "archiving_years, key_deadlines"
    old_value: "archiving_years 10 (GoBD archiving, ten years); 2027 issuing threshold described as prior-year turnover above EUR 800,000"
    new_value: "archiving_years 8 (par. 14b UStG, eight years from the end of the calendar year of issue); 2027 issuing threshold described as prior-year total turnover (Gesamtumsatz) above EUR 800,000"
    description: "Retention was stated as ten years. Par. 14b Abs. 1 Satz 1 UStG in the version in force since 1 January 2025 says eight years; the ten-year period is the version in force until 31 December 2024. The page text on archiving, the penalties paragraph and the readiness test now say eight years. Par. 27 Abs. 38 Nr. 2 UStG sets the EUR 800,000 limit on total turnover (Gesamtumsatz) of the previous calendar year, not on domestic B2B turnover; the deadline text now says so."
    source_url: "https://www.gesetze-im-internet.de/ustg_1980/__14b.html"
    mandate_version_before: 1
    mandate_version_after: 1
  - timestamp: 2026-05-04T00:00:00Z
    type: content-update
    field: "correction_business_continuity.penalties"
    old_value: "no penalty section existed"
    new_value: "Added: Germany has no dedicated financial penalty schedule; consequences via existing tax law (input VAT denial, GoBD audit risk, tax base estimation); penalty_max: null confirmed correct"
    description: "BMF FAQ confirmed silent on penalties. Germany uses consequence-by-incorporation: no per-invoice administrative fine. Input VAT denial is the primary financial risk (invoice reclassified as 'sonstige Rechnung'); GoBD archiving violations trigger audit risk and possible tax base estimation. Penalty model clarified in Correction & Business Continuity section. penalty_max: null confirmed correct."
    source_url: "https://www.bundesfinanzministerium.de/Content/DE/FAQ/e-rechnung.html"
    mandate_version_before: 1
    mandate_version_after: 1
  - timestamp: 2026-05-04T00:00:00Z
    type: confidence-upgrade
    field: "verification status + high-priority items pending verification + last_verified"
    old_value: "pending verification, high-priority items pending verification: 1, last_verified: 2026-04-29"
    new_value: "verified, high-priority items pending verification: 0, last_verified: 2026-05-04"
    description: "Germany reaches verified status. All open items resolved across two verification passes. Rn 35a high-priority item closed: searched BMF Schreiben Oct 2025 for 'maßgeblich' — word only appears as section heading ('Maßgebliche Vorschriften für die Rechnungsausstellung'), not in XML-vs-PDF binding context. Rn 35a citation removed from two locations on page (Tax/Compliance section and Friction Map hybrid illusion paragraph). The innerer Kontrollpfad concept retained as it IS confirmed from the document. Verified status means all current claims are verified, not that the law will not change."
    source_url: "https://www.bundesfinanzministerium.de/Content/DE/Downloads/BMF_Schreiben/Steuerarten/Umsatzsteuer/Umsatzsteuer-Anwendungserlass/2025-10-15-einfuehrung-obligatorische-e-rechnung.pdf?__blob=publicationFile&v=3"
    mandate_version_before: 1
    mandate_version_after: 1
  - timestamp: 2026-05-04T00:00:00Z
    type: content-update
    field: "operational_ownership.tax_compliance + friction_map.hybrid_illusion"
    old_value: "Two citations of 'BMF Schreiben 15.10.2025, Rn 35a' with claim 'XML is legally binding over PDF in case of discrepancy'"
    new_value: "Rn 35a removed from both citations; XML-binding-over-PDF specific claim removed; innerer Kontrollpfad concept and BMF Schreiben URL retained"
    description: "Rn 35a citation unconfirmed: BMF Schreiben Oct 2025 searched thoroughly, 'maßgeblich' found only as section heading. The specific claim that 'XML is legally binding over PDF in case of discrepancy' cannot be sourced to this document at this Rn. Citation removed. The innerer Kontrollpfad concept (internal control path, audit risk from failing to ingest XML) IS referenced in the document and retained."
    source_url: "https://www.bundesfinanzministerium.de/Content/DE/Downloads/BMF_Schreiben/Steuerarten/Umsatzsteuer/Umsatzsteuer-Anwendungserlass/2025-10-15-einfuehrung-obligatorische-e-rechnung.pdf?__blob=publicationFile&v=3"
