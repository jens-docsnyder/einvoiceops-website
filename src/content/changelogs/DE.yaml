  - timestamp: 2024-03-22T00:00:00Z
    type: legislative-event
    field: null
    old_value: null
    new_value: null
    description: "Wachstumschancengesetz enacted: B2B e-invoicing framework established. Receiving obligation (inbound) mandatory from January 1, 2025 for all companies. Sending obligation (outbound) phased: large companies (>EUR 800k revenue) from January 1, 2027; all companies from January 1, 2028. Format: EN 16931-compliant structured invoices (ZUGFeRD, XRechnung, or equivalent). PDF invoices with hybrid XML (Factur-X style) accepted during transition."
    source_url: "https://www.bundesfinanzministerium.de"
    mandate_version_before: null
    mandate_version_after: null
