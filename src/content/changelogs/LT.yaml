    description: "Initial publish. Lithuania B2G via SABIS (Peppol, live since September 2024); B2B January 2028 at policy/announced stage only - no enacted legislation. Source: Gemini Deep Research + Source Registry Round 2 (2026-05-05). Key unverified items: Government Resolution No. 405 as SABIS legal basis (A-URL - nbfc.lrv.lt blocks automated fetch), archiving 10 years. unresolved_high: 1, unresolved_amber: 2."
