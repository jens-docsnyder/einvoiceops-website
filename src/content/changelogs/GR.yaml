    field: null
    old_value: null
    new_value: null
    description: "Law 5222/2025 enacted: Published in FEK A 134/2025. Art. 239 establishes mandatory B2B e-invoice issuance via myDATA. Penalty provisions in Art. 214. MARK (Monimos Arithmos Kataxorisis) registration number assigned by myDATA before invoice is legally issued (clearance model)."
    source_url: "https://et.gr"
