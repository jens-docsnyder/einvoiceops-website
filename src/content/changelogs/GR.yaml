    description: "Initial publish. Greece clearance model (myDATA) - Law 5222/2025 layers mandatory B2B e-invoice issuance on top of existing myDATA e-reporting. Phase 1 March 2, 2026 (>EUR 1M revenue); Phase 2 October 1, 2026 (all others). Source: Gemini Deep Research + Cross-Examination Round 2 (2026-05-05). Key unverified items: Law 5222/2025 penalty amount (EUR 10,000 per audit - A-URL), phase-in dates via Decision A.1044/2026 (A-URL), legal basis gazette reference. unresolved_high: 3, unresolved_amber: 2."
