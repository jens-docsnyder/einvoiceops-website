    description: "Phase 1 B2B mandate dates confirmed via Revenue.ie press release (pr-021026). November 1, 2028: large corporates must issue eInvoices; all businesses must be able to receive. Jens click 2026-05-12."
    source_url: "https://www.revenue.ie/en/corporate/press-office/press-releases/2026/pr-021026-phase-one-vat-modernisation.aspx"
