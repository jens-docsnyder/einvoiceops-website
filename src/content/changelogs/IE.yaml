  - timestamp: 2026-05-12T13:00:00Z
    type: content-update
    field: future_direction
    old_value: "No ViDA reference"
    new_value: "Added: EU ViDA Directive 2025/516/EU (OJ:L_202500516) confirmed at EUR-Lex. DRR and cross-border e-invoice mandatory from July 1, 2030. Primary legal basis for future B2B obligations in countries at policy/planning stage."
    description: "[Augur SIG-005] ViDA Directive 2025/516/EU final text confirmed at EUR-Lex (adopted March 11, 2025, published OJ:L_202500516). future_direction updated to reference July 1, 2030 DRR/cross-border e-invoice mandate. Additive update - no existing GREEN claims affected. IE already has a domestic B2B mandate announced (November 2028/2029 phases); ViDA cross-border obligation is additive context."
    source_url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ:L_202500516"
