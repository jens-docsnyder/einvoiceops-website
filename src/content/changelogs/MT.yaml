    mandate_version_after: 1
  - timestamp: 2026-05-12T12:00:00Z
    type: confidence-upgrade
    field: unresolved_amber
    old_value: "3"
    new_value: "2"
    description: "Ministry of Finance confirmed as responsible authority for B2G e-invoicing in Malta via EC eInvoicing factsheet. Peppol BIS 3.0 confirmed as accepted format. Note: factsheet does not explicitly designate MFIN as Peppol Authority but names Ministry of Finance and Malta Tax and Customs Administration as responsible. Claude WebFetch 2026-05-12."
    source_url: "https://ec.europa.eu/digital-building-blocks/sites/display/DIGITAL/eInvoicing+in+Malta"
