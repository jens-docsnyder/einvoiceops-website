    description: "B2G e-invoicing mandate: L.N. 403 of 2018 and L.N. 404 of 2018 enacted. Transposes EU Directive 2014/55/EU. All Maltese public contracting authorities required to receive Peppol BIS 3.0 structured e-invoices. Ministry for Finance and Employment is responsible authority. Stability: transposition-stable, settled B2G law."
