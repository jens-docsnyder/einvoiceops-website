    description: "15% penalty confirmed: Law 296/2023 amended OUG 120/2021 to add 15% of invoice value fine for B2B e-Factura violations — both issuer (not transmitting through RO e-Factura) and recipient (recording non-transmitted invoices) are liable. Effective July 1, 2024. Article 13^1 as amended by Law 296/2023 confirmed from multiple Romanian tax sources. Page claim confirmed correct. Last amber item removed. confidence_summary upgraded to green. last_verified set to 2026-05-06."
    source_url: "https://edicomgroup.com/blog/romania-moves-towards-electronic-invoicing-ro-efactura-platform"
