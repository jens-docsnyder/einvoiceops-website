    description: "BNR exchange rate rule confirmed: Art. 290 of Codul Fiscal (formerly Art. 139^1) states 'ultimul curs de schimb comunicat de Banca Nationala a Romaniei' (last BNR rate) as the default for VAT invoice purposes. Parties may contractually specify a commercial bank rate instead. For foreign groups without such contractual specification, BNR daily rate applies. Page claim (BNR daily rate, not monthly average) confirmed substantively correct. ANAF e-factura page returns no results for 'cursul BNR' — source is Fiscal Code directly. Amber item removed."
    source_url: "https://lege5.ro/Gratuit/g43donzvgi/cursul-de-schimb-valutar-codul-fiscal"
