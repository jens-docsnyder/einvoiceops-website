    description: "Federal e-invoicing mandatory: EVRE (SR 611.06, Verordnung ueber die elektronische Rechnung im Bundesbereich) entered into force. All suppliers to the federal administration required to submit e-invoices from January 1, 2016. Scope: federal administration (Bundesverwaltung) only, not cantons or municipalities. Stability: settled, no B2B mandate planned."
