    new_value: "Authentication transition paragraph added: OAuth2 tokens valid through 31 December 2026, KSeF certificates required from 1 January 2027, certificate functionality live in KSeF API 2.0 since February 2026. Penalty_max field extended with MoF March 2026 clarification that maximum penalties do not have to apply automatically (case-by-case assessment). confidence_summary: amber, unresolved_amber: 2"
    description: "Mandate monitoring scan 2026-05-18 on PL KSeF Tax-cluster signals for Heikki demo KSeF anchor slide. Primary source ksef.podatki.gov.pl/informacje-ogolne-ksef-20/certyfikaty-ksef/ confirmed token-to-certificate transition timeline (Nov 2025 testing, Feb 2026 cert functionality, Dec 31 2026 token retirement, Jan 1 2027 cert-only). VATupdate Tier 3 source confirmed Polish MoF March 2026 penalty discretion clarification. Both additive to PL.md. Per cascade rule: GREEN page + additive content → AMBER pending Jens click. Two AMBER research items written. Source content used inline in new Heikki demo KSeF anchor slide."
