    type: confidence-upgrade
    field: "items pending verification"
    old_value: "2"
    new_value: "1"
    description: "KSeF number 35-character claim confirmed from KSeF API v2 production spec (api.ksef.mf.gov.pl/docs/v2): schema defines KsefNumber as minLength 35, maxLength 36 (36 accepted for KSeF 1.0 backward compat only). Spec states: 'W KSeF 2.0 numery są generowane wyłącznie w formacie 35-znakowym.' One item remains pending: FA(2) schema January 31, 2026 invalidation date — API spec confirms FA(3) as current standard but specific date not found. Open item updated with this finding and next search direction (github.com/CIRFMF/ksef-docs changelog). Status stays pending verification."
    source_url: "https://api.ksef.mf.gov.pl/docs/v2/index.html"
    mandate_version_before: 1
    mandate_version_after: 1
  - timestamp: 2026-05-04T00:00:00Z
    type: confidence-upgrade
    field: "high-priority items pending verification"
    old_value: "1"
    new_value: "0"
    description: "PLN 200M Phase 1 threshold and 2024 reference year confirmed from consolidated KSeF act text (Dz.U. 2023 poz. 1598, Article 145l): 'did not exceed PLN 200,000,000 in 2024' — companies below threshold received grace extension to March 31, 2026; companies above were mandatory from February 1, 2026. Page claim confirmed correct. Two pending verification items remain open (FA(2) schema date, KSeF number 35 chars). Status stays pending verification."
    source_url: "https://isap.sejm.gov.pl/isap.nsf/download.xsp/WDU20230001598/U/D20231598Lj.pdf"
