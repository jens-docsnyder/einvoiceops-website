    description: "Jens click on both PL AMBER items closed simultaneously. (1) ksef.podatki.gov.pl/informacje-ogolne-ksef-20/certyfikaty-ksef/ confirmed verbatim: 'Od 1 lutego 2026 r. możliwe jest więc korzystanie zarówno z certyfikatów KSeF jak i tokenów. Docelowo od 1 stycznia 2027 r. z tych dwóch rozwiązań pozostaną wyłącznie certyfikaty KSeF.' (From 1 February 2026 both certificates and tokens may be used; ultimately from 1 January 2027 only certificates will remain.) Plus MCU certificate generation Nov 2025-Jan 2026 confirmed, certificates serve solely as authentication (not permissions store like tokens) confirmed. Bonus content surfaced not on page: Type 1 (authentication) vs Type 2 (offline-mode invoice signing) certificate distinction; 2-year max validity; XAdES-BES signature mechanism. (2) VATupdate Tier 3 confirmed MoF March 2026 penalty discretion position (2026 zero penalties, 2027 case-by-case based on nature/scale/frequency/corrective actions, maximum is a ceiling not default). Tier 3 caveat noted - primary source ksef.podatki.gov.pl/wyjasnienia/ would be stronger but content verified by Jens click and consistent across multiple secondary sources (txb.pl, sovos.com, aidergroup.pl). Both research items closed. PL restored to GREEN."
