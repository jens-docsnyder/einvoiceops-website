    mandate_version_after: 2
  - timestamp: 2026-05-12T09:30:00Z
    type: mandate-change
    field: "penalty_max + future_direction + key_deadlines + verification status + last_verified + mandate_version"
    old_value: "Penalties suspended until August 1, 2026 (from Dz.U. 2024 poz. 852)"
    new_value: "Penalties suspended until December 31, 2026; enforcement begins January 1, 2027 per Act of August 5, 2025 (Dz.U. 2025 poz. 1203 Art. 23 pkt 4)"
    description: "Act of August 5, 2025 verified (Dz.U. 2025 poz. 1203). Art. 23 pkt 4 confirms: Art. 106ni ust. 1-3 and 5-7 (penalty provisions) enter into force January 1, 2027 - not August 1, 2026 as previously stated. Key_deadlines 2026-08-01 entry removed. New 2027-01-01 penalty enforcement entry added. penalty_max and future_direction updated. Body text in Preparation Timeline updated. All open items cleared. verification status: pending verification → verified. mandate_version: 1 → 2."
    source_url: "https://dziennikustaw.gov.pl/DU/2025/1203"
    mandate_version_before: 1
    mandate_version_after: 2
  - timestamp: 2026-05-12T10:00:00Z
    type: error-correction
    field: "penalty_max + key_deadlines (2026-08-01)"
    old_value: "Penalties suspended until August 1, 2026"
    new_value: "PENDING VERIFICATION - Suspension ends December 31, 2026 (enforcement from January 1, 2027) per Dz.U. 2025/1203"
    description: "Penalty suspension end date flagged as potentially wrong. PL page states August 1, 2026 as penalty enforcement start. Source search on ksef.podatki.gov.pl confirms penalties suspended Feb 1, 2026 to Dec 31, 2026, enforcement from January 1, 2027. Dz.U. 2025/1203 (Act of August 5, 2025) identified as primary source. Page not updated until verified against the primary source."
    source_url: "https://dziennikustaw.gov.pl/DU/2025/1203"
