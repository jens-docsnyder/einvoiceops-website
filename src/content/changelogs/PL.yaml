    description: "Verification pass found two cited sources to be wrong documents. PL-1: the May 2024 amending act (poz. 852) only amends transition dates — the PLN 200M threshold and 2024 reference year are in the original June 2023 KSeF mandate act (poz. 1598). New source to check: isap.sejm.gov.pl poz.1598. PL-2: the podatki.gov.pl/ksef main page leads to example FA(3) invoice PDFs, not the API specification needed to confirm the 35-character KSeF number identifier. New source to check: API documentation at podatki.gov.pl or ksef.mf.gov.pl. Both items remain open — claims on page unverified, counts unchanged."
