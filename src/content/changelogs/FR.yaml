    old_value: "EUR 15 per invoice (cap EUR 15,000/year); EUR 250 per e-reporting transmission (cap EUR 15,000/year)"
    new_value: "EUR 50/invoice for failure to issue electronically (Art. 1737 §III CGI, cap EUR 15,000/year); EUR 15/invoice for content errors (Art. 1737 §II CGI, cap 25% of invoice amount); EUR 500-1,000/quarter escalating for failure to use certified PDP for reception (Art. 1737 §IV bis CGI). First infraction exempt if corrected within 30 days (Art. 1737 §V CGI)."
    description: "Penalty figures were wrong. Article 1737 CGI confirmed from legifrance: §II EUR 15/invoice applies to content errors only (cap 25% of invoice amount, no EUR 15K/year cap); §III EUR 50/invoice applies to failure to issue electronically (cap EUR 15K/year); §IV EUR 50/invoice is PDP liability for data transmission failures, not taxpayer liability (cap EUR 45K/year); §IV bis sets escalating fines for failure to use PDP for reception (warning → EUR 500 → EUR 1K/quarter). EUR 250/e-reporting figure did not appear in Article 1737 at all. mandate_version incremented."
    source_url: "https://www.legifrance.gouv.fr/codes/id/LEGITEXT000006069577/"
