  - timestamp: 2021-04-01T00:00:00Z
    type: legislative-event
    field: null
    old_value: null
    new_value: null
    description: "Online Szamla mandatory for all B2B: All invoices (B2B and B2C) must be reported to NAV Online Szamla in real-time (within 24 hours for software-generated invoices). No invoice value threshold for mandatory reporting. Stability: live-stable, fully operational since 2021."
