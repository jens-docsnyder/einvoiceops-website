    description: "HUF 1,000,000 penalty confirmed for non-natural persons (legal entities) in Act CL of 2017, Art. 220, paragraph 1. HUF 400,000 for natural persons. Basis is per violation of obligation, not per invoice. penalty_max field updated to reflect verified framing. Jens click 2026-05-12."
