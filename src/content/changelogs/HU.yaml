    description: "Online Szamla launched: Hungarian Tax and Customs Authority (NAV) introduced the Online Invoice (Online Szamla) real-time reporting system. Initially voluntary for B2B invoices above HUF 100,000."
    source_url: "https://onlineszamla.nav.gov.hu"
