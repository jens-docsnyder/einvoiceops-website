    description: "AbgAenG 2025 (Abgabenaenderungsgesetz 2025) enacted: B2B e-invoicing mandatory from January 1, 2028 for all companies established in Austria. Law published in BGBl. I. This is the first B2B mandate; prior to this law no B2B obligation existed. Stability: active-rollout, implementation window 2025-2028."
    source_url: "https://www.parlament.gv.at"
