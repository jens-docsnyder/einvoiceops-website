    description: "B2G e-invoicing mandatory: Austria transposed EU Directive 2014/55/EU via IKT Konsolidierungsgesetz and BVergG 2018 §368. All contracting authorities required to receive EN 16931-compliant invoices. Two CIUS defined: one for B2G (government sector) and one for B2B (national VAT law). Stability: settled law, no amendments expected."
    source_url: "https://ec.europa.eu/digital-building-blocks/sites/display/DIGITAL/eInvoicing+in+Austria"
