    description: "NEN platform established: Act 134/2016 on Public Procurement established NEN (Narodni elektronicky nastroj) as the mandatory B2G e-procurement platform operated by Ministry of Regional Development. Accepted formats: UBL 2.1, CII, ISDOC/ISDOCX v5.2+. Stability: settled, no B2B mandate."
