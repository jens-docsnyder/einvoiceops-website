    description: "Initial publish. Norway Peppol B2G mandate - EHF 3.0 (Peppol BIS 3.0), mandatory for all public sector suppliers. EEA member, not EU - ViDA not applicable. No B2B mandate. Key unverified items: mandate dates (July 2012 central gov, April 2019 all public entities), Anskaffelsesforskriften §11-3 legal basis, archiving period (5 years Bokføringsloven §13), Peppol scheme 0192. unresolved_high: 2, unresolved_amber: 2."
    source_url: null
    mandate_version_before: null
    mandate_version_after: 1
  - timestamp: 2026-05-12T12:01:00Z
    type: content-update
    field: unresolved_high
    old_value: "2"
    new_value: "1"
    description: "Research items updated from Claude WebFetch 2026-05-12. Key findings: (1) Legal basis is FOR-2019-04-01-444 (Forskrift om elektronisk faktura i offentlige anskaffelser), NOT Anskaffelsesforskriften § 11-3 which does not exist. (2) EC factsheet confirms April 2, 2019 for all public authorities. (3) Bokföringsloven § 13 shows 3.5 years for invoices (items 5-8) vs 5 years for accounting records (items 1-4) - archiving_years: 5 on page may need updating. Two HIGH items merged into one; amber archiving item updated with nuance found."
    source_url: "https://ec.europa.eu/digital-building-blocks/sites/display/DIGITAL/eInvoicing+in+Norway"
    mandate_version_before: 1
    mandate_version_after: 1
  - timestamp: 2012-07-01T00:00:00Z
    type: legislative-event
    field: null
    old_value: null
    new_value: null
    description: "Central government early adoption: Norwegian central government mandated e-invoicing for central government suppliers from July 1, 2012. Administrative decision predating EU Directive. EHF (Elektronisk Handelsformat) format used."
    source_url: "https://www.anskaffelser.no"
    mandate_version_before: null
    mandate_version_after: null
  - timestamp: 2019-04-01T00:00:00Z
    type: legislative-event
    field: null
    old_value: null
    new_value: null
    description: "FOR-2019-04-01-444: Forskrift om elektronisk faktura i offentlige anskaffelser entered force. All Norwegian public authorities at central and local level required to receive and process e-invoices from April 1, 2019. Legal basis: EU EEA Directive 2014/55/EU transposition. Format: EHF/Peppol BIS 3.0 via Peppol network. Scheme 0192 for Norwegian organisasjonsnummer. Note: Anskaffelsesforskriften section 11-3 does not contain e-invoicing mandate - the specific regulation is FOR-2019-04-01-444."
    source_url: "https://lovdata.no/dokument/SF/forskrift/2019-04-01-444"
    mandate_version_before: null
    mandate_version_after: null
  - timestamp: 2026-05-12T13:30:00Z
    type: confidence-upgrade
    field: unresolved_high
    old_value: "1"
    new_value: "0"
    description: "FOR-2019-04-01-444 confirmed as correct legal basis for Norwegian B2G e-invoice mandate via Claude WebFetch (lovdata.no). Regulation mandates 'stille krav om bruk av elektronisk faktura i godkjent standardformat' effective April 2, 2019 for all procurements initiated after entry into force. Formats: EHF v3.0+ or Peppol BIS Billing v3.0+. Peppol network required. Note: Anskaffelsesforskriften (FOR-2016-08-12-974) § 11-3 does not exist - research items corrected. July 2012 central government early adoption not in this regulation (pre-mandate administrative initiative)."
    source_url: "https://lovdata.no/dokument/SF/forskrift/2019-04-01-444"
    mandate_version_before: 1
    mandate_version_after: 1
  - timestamp: 2026-05-12T14:00:00Z
    type: confidence-upgrade
    field: unresolved_amber
    old_value: "2"
    new_value: "1"
    description: "Archiving 5 years confirmed via Jens click (Bokføringsloven § 13, lovdata.no, 2026-05-12). Full text reviewed: e-invoices are 'dokumentasjon av bokførte opplysninger' (documentation of bookkeeping records) - items 1-4 in § 13, 5-year retention. The 3.5-year period (items 5-8) covers agreements, correspondence, delivery notes - not invoices as primary accounting documentation. archiving_years: 5 is correct."
    source_url: "https://lovdata.no/dokument/NL/lov/2004-11-19-73"
    mandate_version_before: 1
    mandate_version_after: 1
  - timestamp: 2026-05-12T15:00:00Z
    type: confidence-upgrade
    field: confidence_summary
    old_value: amber
    new_value: green
    description: "Peppol scheme 0192 for Norwegian organisasjonsnummer confirmed via Jens click (anskaffelser.no, 2026-05-12). Exact text: 'Man må legge inn landkoden, f.eks. Norge 0192: + organisasjonsnummer' confirming 0192 as the country code/scheme for Norwegian Peppol participants. master_data_id field confirmed. All research items resolved. NO goes GREEN."
    source_url: "https://www.anskaffelser.no/e-handel/e-faktura/peppol"
    mandate_version_before: 1
    mandate_version_after: 1
