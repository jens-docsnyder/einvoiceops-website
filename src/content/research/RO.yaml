    description: "OUG NUMBER FLAG: EC eInvoicing Country Factsheet RO (August 2025) cites 'Emergency Government Ordinance No. 138/2024' (not OUG 89/2025) as the regulation amending e-invoicing rules effective January 1, 2025. Our research item searches for OUG 89/2025 — this may be a wrong OUG number, or there could be two separate ordinances. Search: 'OUG 138/2024 Monitorul Oficial Romania e-factura' first, then 'OUG 89/2025'. Confirm which ordinance (or both) covers: (1) the 5-day submission window and (2) expansion to non-resident VAT-registered entities. If OUG 138/2024 is the correct source: update any legal citation on the RO page that references OUG 89/2025. If both exist: note both in the citation."
    source_url: null
    added: 2026-05-01
