    description: "No source URL — search: 'OUG 120/2021 art 13^1 Legea 296/2023 penalitate e-factura' OR 'GEO 120/2021 amendament 15 la suta'. Also try: legislatie.just.ro or monitoruloficial.ro for OUG 120/2021 as amended. Confirm: 15% of invoice value penalty in Art. 13^1 of GEO 120/2021 as amended by Law 296/2023. If found: add source_url → remove + decrement amber. If percentage or article reference is different: update penalty_pct and legal citation on RO page."
