    description: "Open source link (EUR-Lex search) → the search should return Decision 2023/1553. Click the result and Ctrl+F '31 December 2026' or '2023/1553'. Confirm: exact decision number is 2023/1553 and it expires December 31, 2026. If confirmed: update source_url on this item to the direct EUR-Lex document link (not the search URL), no page change → remove + decrement amber. If expiry date differs: update the derogation_expiry note on RO page."
