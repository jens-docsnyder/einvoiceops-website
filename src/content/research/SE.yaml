    description: "INQUIRY CLAIM UNVERIFIED: SE page future_direction previously stated 'Ministry of Finance formal inquiry into EU ViDA B2B mandate launched February 5, 2026, report due November 30, 2027.' Swedish government website (regeringen.se/rattsliga-dokument/kommittedirektiv/2026/02/) shows only two Feb 2026 kommittédirektiv — neither about e-invoicing or ViDA. Claim was removed from SE page and key_deadlines on 2026-05-04; orphaned body paragraph also removed 2026-05-06. If an inquiry was subsequently launched: search regeringen.se for 'elektronisk faktura' or 'ViDA' in kommittédirektiv; find the correct date and report deadline; add back to SE page future_direction and key_deadlines."
