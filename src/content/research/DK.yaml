    description: "WRONG CITATION on DK page: penalty_max says 'Bogføringsloven Section 26' but §26 only contains enforcement options (påtale, påbud om rettelse, påbud om ophør + revisorerklæring) — no DKK 1,500,000 or compulsory dissolution. Confirmed by Jens 2026-05-06. DKK 1,500,000 as max fine is confirmed correct from secondary sources (Dansk Erhverv, PwC DK). Criminal penalty section is straffebestemmelser, likely §28 or §29. Jens: open retsinformation.dk/eli/lta/2022/700 → Ctrl+F '§ 28' or 'bøde' or '1.500.000'. Confirm: (1) DKK 1,500,000 fine is in §28 (or another section), (2) whether compulsory dissolution (tvungen opløsning) is also in that section or referenced from elsewhere. If §28 is confirmed: update penalty_max on DK page to change 'Section 26' to '§28'. If dissolution is in a different section: update citation accordingly."
