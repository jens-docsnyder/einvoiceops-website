    description: "Open source link (BOE for December 2, 2025) → look for Real Decreto-ley 15/2025 in the BOE index for that date. Once found, Ctrl+F '1 de enero de 2027' and '1 de julio de 2027'. Confirm: January 1, 2027 (large companies) and July 1, 2027 (SMEs) go-live dates are in the published RD-ley 15/2025 text. If confirmed: no page change → remove + decrement amber. If dates differ: update key_deadlines on ES page."
