    description: "TicketBAI exclusion — entities tax-domiciled in Basque Country (Araba, Bizkaia, Gipuzkoa) and Navarre are excluded from Verifactu and must implement TicketBAI instead. Verify the exact exclusion mechanism in Real Decreto 1007/2023 or Orden HAC/1177/2024 — or whether this is established in Basque/Navarre regional legislation."
