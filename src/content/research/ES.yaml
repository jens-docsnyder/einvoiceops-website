    description: "Open source link (BOE for October 17, 2024, Orden HAC/1177/2024) → find the Orden in the BOE index for that date. Ctrl+F 'artículo 11' or 'primer registro' or 'cadena'. Confirm: Art. 11 contains the 'Primer registro' provision that permits a documented chain reset on system migration. If confirmed: no page change → remove + decrement amber. If Art. 11 does not contain this: check Art. 8 or Art. 9 (technical provisions). If absent entirely: remove the chain reset claim from ES page or flag as unconfirmed."
