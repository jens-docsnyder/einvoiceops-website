  - priority: amber
    type: source-verification
    description: "No source URL — search: 'Real Decreto 1007/2023 TicketBAI exclusión Verifactu País Vasco Navarra' OR 'Orden HAC/1177/2024 entidades excluidas'. Confirm: entities tax-domiciled in the Basque Country (Araba, Bizkaia, Gipuzkoa) and Navarre are explicitly excluded from Verifactu/SIF and must implement TicketBAI instead, either in RD 1007/2023 or Orden HAC/1177/2024 or regional tax authority legislation (Haciendas Forales). If found: add source_url → remove + decrement amber. If the exclusion is only in regional law: update the TicketBAI note on ES page to specify it is established in Basque/Navarre foral law, not national regulation."
    source_url: null
    added: 2026-05-01
