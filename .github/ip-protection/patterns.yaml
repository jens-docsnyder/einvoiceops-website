# einvoiceops IP gate pattern library
# Version: 1.3 | Last updated: 2026-10-21
#
# This file is public. The patterns list what we are protecting.
# No person, prospect or account name is written in it, not even partly or in brackets.
# Every rule that has to match a name (the site owner's name included) lives in a private
# list kept outside this repository, and the scanner loads it with its --private option or
# IP_GATE_PRIVATE_PATTERNS. The scanner refuses an exception that does not name its rule.
# That is an accepted trade-off: the gate's primary value is blocking
# accidental commits, not stopping a determined adversary who already
# has repo access. Review this trade-off if the repo becomes private.
#
# Severity:
#   critical → immediate exit 1, blocks deploy
#   high     → exit 1, blocks deploy
#   medium   → warning only, deploy proceeds but PR is annotated

rules:

  # ── CATEGORY A: Internal product and system names ──────────────────────────
  # These names must never appear in public-facing files.

  - id: IP-A01
    category: A
    severity: critical
    type: regex
    pattern: '\bVigil\b'
    description: "Internal product name (monitoring pipeline). Use outcome language only."

  - id: IP-A02
    category: A
    severity: critical
    type: regex
    pattern: '\bAugur\b'
    description: "Internal product name (signal detection layer). Never external."

  - id: IP-A03
    category: A
    severity: critical
    type: regex
    pattern: '\bActa\b'
    description: "Internal registry name. Check context — 'contact' or 'exact' are false positives."

  - id: IP-A04
    category: A
    severity: critical
    type: literal
    pattern: "Canonical Model"
    description: "Internal ERP cluster framework. Never share externally."

  - id: IP-A05
    category: A
    severity: critical
    type: literal
    pattern: "Readiness Map"
    description: "Internal methodology name. Describe outputs, not the methodology."

  - id: IP-A06
    category: A
    severity: critical
    type: literal
    pattern: "Content RAG"
    description: "Internal content policy system name."

  - id: IP-A07
    category: A
    severity: critical
    type: literal
    pattern: "Confidence Board"
    description: "Internal dashboard name. Not for external audiences."

  - id: IP-A08
    category: A
    severity: high
    type: literal
    pattern: "Signal Engine"
    description: "Internal CRM outreach system name."

  - id: IP-A09
    category: A
    severity: high
    type: literal
    pattern: "Source Registry"
    description: "Internal domain trust classification document. Reveals monitoring source network."

  - id: IP-A10
    category: A
    severity: critical
    type: literal
    pattern: "Provenance"
    description: "Internal verification system name. Only flag if used as a proper noun/system name."

  # ── CATEGORY A: Internal architecture terms ────────────────────────────────

  - id: IP-A11
    category: A
    severity: critical
    type: literal
    pattern: "SPARQL"
    description: "Reveals EUR-Lex monitoring query architecture."

  - id: IP-A12
    category: A
    severity: critical
    type: literal
    pattern: "CELLAR"
    description: "Reveals EUR-Lex CELLAR endpoint as monitoring source."

  - id: IP-A13
    category: A
    severity: high
    type: literal
    pattern: "Cloud Function"
    description: "GCP architecture detail. Reveals infrastructure provider and pipeline design."

  - id: IP-A14
    category: A
    severity: high
    type: literal
    pattern: "europe-west3"
    description: "GCP region identifier. Reveals hosting infrastructure."

  - id: IP-A15
    category: A
    severity: high
    type: literal
    pattern: "Vertex AI"
    description: "Reveals AI infrastructure provider."

  - id: IP-A16
    category: A
    severity: high
    type: literal
    pattern: "Legifrance PISTE"
    description: "Reveals specific French monitoring API used."

  # ── CATEGORY B: Methodology language (system-agency verbs) ─────────────────
  # Phrases that describe HOW the product works, not WHAT it produces.

  - id: IP-B01
    category: B
    severity: high
    type: regex
    pattern: '\b(we|our system|the engine|einvoiceops)\s+(scan|crawl|scrape|parse|detect|extract|transform)\b'
    description: "System-agency verb reveals internal pipeline. Rewrite as customer outcome."

  - id: IP-B02
    category: B
    severity: high
    type: regex
    pattern: '\b(we|our system|einvoiceops|the retainer|the service)\s+monitor\b'
    description: "Monitoring architecture disclosure. Use: 'When requirements change, you get...'"

  - id: IP-B02b
    category: B
    severity: high
    type: regex
    pattern: '\b(re-routed|rerouted)\b'
    description: "Routing verb reveals RACI mechanism. Use 'goes to', 'delivered to', or 'sent to'."

  - id: IP-B02c
    category: B
    severity: medium
    type: regex
    pattern: '\bmore monitored\b'
    description: "Reveals active country-level monitoring capability. Use 'more covered'."

  - id: IP-B02d
    category: B
    severity: medium
    type: regex
    pattern: 'the monitoring scales'
    description: "Template-based alert architecture tell (Gemini adversarial test). Remove 'The monitoring'."

  - id: IP-B03
    category: B
    severity: high
    type: regex
    pattern: '\b(is|are) detected\b'
    description: "Passive monitoring trigger language. Reveals event-based architecture."

  - id: IP-B04
    category: B
    severity: medium
    type: regex
    pattern: '\bchange detection\b'
    description: "Monitoring architecture term. Use outcome language instead."

  - id: IP-B05
    category: B
    severity: medium
    type: regex
    pattern: '\bdiff-based\b'
    description: "Technical architecture hint — diff-based monitoring."

  - id: IP-B06
    category: B
    severity: medium
    type: regex
    pattern: 'when.*(?:mandate|requirement).*changes?.*(?:we|trigger|send|notif)'
    description: "Monitoring trigger pattern — reveals event-driven architecture."

  # ── CATEGORY B: Expert-readable methodology tells (from adversarial test) ───

  - id: IP-B07
    category: B
    severity: medium
    type: regex
    pattern: '\bbatch\s+(sync|upload|process|job)\b'
    description: "Expert tell: implies non-realtime/async architecture. Use 'continuous updates'."

  - id: IP-B08
    category: B
    severity: medium
    type: regex
    pattern: '\bmanual\s+(validation|override|queue)\b'
    description: "Expert tell: reveals human-in-loop backend. Describe outcome, not process."

  - id: IP-B09
    category: B
    severity: high
    type: regex
    pattern: '\bhard-coded\s+(mandate|mapping|rule)\b'
    description: "Tech debt signal to expert readers. Never use this phrasing externally."

  # ── Expert vocabulary patterns (Gemini adversarial test, Prompt 4) ──────────
  # Phrases that are safe to laypeople but reveal architecture to domain experts.

  - id: IP-E01
    category: B
    severity: medium
    type: regex
    pattern: '\bjurisdictional\s+wrapper\b'
    description: "Big Four tell: implies fragmented country-by-country code, not a unified engine."

  - id: IP-E02
    category: B
    severity: medium
    type: regex
    pattern: '\bindirect\s+tax\s+engine\s+integration\b'
    description: "Implies reliance on a third-party tax calculation layer (Vertex, Avalara). Reveals we don't own the tax math."

  - id: IP-E03
    category: B
    severity: high
    type: regex
    pattern: '\bpoint-to-point\s+mapping\b'
    description: "Scalability death knell to any RegTech investor or AP platform expert. Never use externally."

  - id: IP-E04
    category: B
    severity: medium
    type: regex
    pattern: '\bimplementation[-\s]heavy\b'
    description: "Signals consulting-firm-masquerading-as-SaaS to investors. Avoid in all external copy."

  - id: IP-B10
    category: B
    severity: medium
    type: regex
    pattern: '\b(scales with your footprint|scales with the footprint)\b'
    description: "Template-based alert architecture tell (Gemini adversarial test finding)."

  # ── CATEGORY C: Technical architecture and credential hints ────────────────

  - id: IP-C01
    category: C
    severity: critical
    type: regex
    pattern: '(apiKey|api_key|secret_key|auth_token|bearer_token)\s*[:=]\s*["\x27][^\s]'
    description: "Hardcoded credential pattern. Remove immediately."

  - id: IP-C02
    category: C
    severity: critical
    type: regex
    pattern: '\b10\.\d{1,3}\.\d{1,3}\.\d{1,3}\b'
    description: "Internal RFC1918 IP address detected."

  - id: IP-C03
    category: C
    severity: high
    type: regex
    pattern: '\.internal\.(company|cluster)\.local'
    description: "Internal DNS suffix detected."

  - id: IP-C04
    category: C
    severity: high
    type: literal
    pattern: "direct fetch"
    description: "Implies automated HTTP access to sources. Use 'verified against' instead."

  - id: IP-C05
    category: C
    severity: medium
    type: regex
    pattern: 'we monitor.{0,40}(official|government|authority)\s+sources'
    description: "Monitoring network disclosure. Rewrite as outcome: 'When requirements change...'"

  # ── CATEGORY D: Changelog and audit trail internal references ──────────────

  - id: IP-D01
    category: D
    severity: critical
    type: regex
    pattern: '\[Augur\s+SIG-\d+\]'
    description: "Internal signal tag in public changelog. Strip prefix before committing."

  - id: IP-D02
    category: D
    severity: high
    type: literal
    pattern: "Source Registry Round"
    description: "Internal document name in changelog description. Use 'external source verification'."

  - id: IP-D03
    category: D
    severity: high
    type: regex
    pattern: 'EUR-Lex\s+(?:CELLAR\s+)?SPARQL'
    description: "Specific monitoring endpoint type revealed. Remove from any public-facing text."

  - id: IP-D04
    category: D
    severity: medium
    type: regex
    pattern: 'phase2Built|Cloud Functions.*\$[0-9].*month'
    description: "Infrastructure build status and cost details. Keep in status.astro only."

  - id: IP-D05
    category: D
    severity: high
    type: regex
    pattern: '\bTier[\s_-]*[1-3]\b'
    description: "Internal source grading label. Say what the source is (official journal, tax authority page, trade publication) instead."

  - id: IP-D06
    category: D
    severity: critical
    type: regex
    pattern: 'CLAUDE\.md'
    description: "Internal instructions file name. Never in public text."

  - id: IP-D07
    category: D
    severity: critical
    type: regex
    pattern: '\b(feedback|project|reference|user)_[a-z0-9_]+\.md\b'
    description: "Internal memory file name. Never in public text."

  - id: IP-D09
    category: D
    severity: medium
    type: regex
    pattern: '-cluster\b|\bcluster\b'
    description: "Internal term. Externally say 'invoicing function'. Medium because the approved Operational Ownership closing sentence still uses it on country pages."


  # ── CATEGORY F: Internal working notes, attributions and process words ─────
  # Added 2026-10-15 after the changelog and verification-queue leak (row 1229).
  # The class: how the work was done and who said what, as opposed to what is true.

  # IP-D08 and IP-F01 (a person named in an internal verification act or instruction) are not in
  # this file: they name a person, so they live in the private list outside this repository.

  - id: IP-F02
    category: F
    severity: high
    type: regex
    case_sensitive: true
    pattern: '\b[A-Z][a-z]{2,}\s+demo\s+(?:screens?|decks?|slides?)\b|\b(?:for|from)\s+[A-Z][a-z]{2,}\s+demo\b'
    description: "A demo prepared for a named person or account. Customer and prospect material never appears in this repository."

  - id: IP-F03
    category: F
    severity: critical
    type: regex
    pattern: '\bSIG[\s_-]*\d{1,4}\b'
    description: "Internal signal registry id. Strip it."

  - id: IP-F04
    category: F
    severity: high
    type: regex
    case_sensitive: true
    pattern: '\b(?:WebFetch(?:ed)?|Gemini|Deep[\s_-]+Research|Anthropic|Claude|Opus|Sonnet|CLAUDE|OPUS|SONNET|DEEP[\s_-]+RESEARCH)\b'
    description: "Names the tool or model used in the research method. Say what the source is, not how it was read."

  - id: IP-F05
    category: F
    severity: high
    type: regex
    pattern: '\b(?:second|check|steering|fix|test|data|cold[\s_-]+read|copy[\s_-]+check)[\s_-]+seat\b'
    description: "Internal review process wording. Describe the fact, not who checked it."

  - id: IP-F06
    category: F
    severity: high
    type: regex
    case_sensitive: true
    pattern: '\b(?:Market Intelligence|Product Design|Product Research|Country Data|Work Items|Accounts)/|\b[vV]ault\b'
    description: "Names an internal folder or the private notes store. Reveals how the work is organised."

  - id: IP-F07
    category: F
    severity: critical
    type: regex
    pattern: '/Users/[A-Za-z]'
    description: "Absolute path on a working machine."

  - id: IP-F08
    category: F
    severity: high
    type: regex
    case_sensitive: true
    pattern: '\bAMBER\b|\bRED\b(?=\s+(?:item|label|state|status|claim))'
    description: "Internal confidence state word. A public claim is either stated with its source or left out."

  - id: IP-F09
    category: F
    severity: high
    type: regex
    pattern: '\b(?:research[\s_-]+(?:YAML|queue|items?|files?)|verification[\s_-]+queue)\b'
    description: "Names the internal verification queue."

  - id: IP-F10
    category: F
    severity: critical
    type: regex
    case_sensitive: true
    pattern: '\[?A-(?:DIV|URL|CONF|BEH)\b'
    description: "Internal claim marker."

  - id: IP-F11
    category: F
    severity: high
    type: regex
    pattern: '\bruled\s+(?:by\s+[A-Za-z ]{1,30}?\s+)?\d{4}-\d{2}-\d{2}\b'
    description: "Internal ruling and its date. State the rule, not its history."

  - id: IP-F12
    category: F
    severity: medium
    type: regex
    case_sensitive: true
    pattern: '\b[A-Z]{2}-E\d{2}[a-z]?\b|\b[A-Z]{2}-changes\.csv\b'
    description: "Internal change-record id or data file name. Medium: the ids are data keys in the build inputs and do not reach the built pages; keep them out of prose and comments."

  - id: IP-F13
    category: F
    severity: high
    type: regex
    pattern: '\b(?:WebFetch(?:ed)?|Gemini|Anthropic)\b'
    description: "Names the tool or model used in the research method, in any letter case. Say what the source is, not how it was read."

  - id: IP-F14
    category: F
    severity: high
    type: regex
    pattern: '^\s*[-\s]*[\x22\x27]?priority[\x22\x27]?\s*:\s*[\x22\x27]?(?:high|amber)\b'
    description: "A verification-queue priority field. The open-items list is kept outside the repository."


  # ── CATEGORY L: Language rules (German, French, Polish) ────────────────────
  # Added 2026-10-21 for the translated pages. A translator who renders an internal term or an
  # authority claim in German, French or Polish is stopped here as the English one is above.
  # The scanner also tests each line with accents and look-alike letters folded away, so a
  # pattern written without diacritics still matches the accented spelling.

  - id: IP-L01
    category: L
    severity: critical
    type: regex
    pattern: '\b(?:Vigil(?:s|a|u|em|owi)|Augur(?:s|a|u|em|owi|ze))\b'
    description: "Inflected form of an internal product name (German genitive, Polish cases). Use outcome language only."

  - id: IP-L02
    category: L
    severity: medium
    type: regex
    pattern: '\b(?:vigiles?|augures?)\b'
    description: "French rendering of an internal product name. Also an ordinary French word, so a warning: rephrase it."

  - id: IP-L03
    category: L
    severity: medium
    type: regex
    pattern: '\bprovenance\b|\bprovenienz\w*|\bproweniencj\w*'
    description: "Rendering of an internal system name. Also an ordinary word, so a warning: say where a change came from instead."

  - id: IP-L04
    category: L
    severity: critical
    type: regex
    pattern: '\breadiness[\s-]*(?:map|karte|carte)\w*|\bbereitschafts[\s-]*(?:karte|map)\w*|\bcartes?\s+de\s+(?:pr[ée]paration|maturit[ée]|readiness)\b|\bmap\w*\s+gotowo[sś]ci\b'
    description: "Translated internal methodology name. Describe outputs, not the methodology."

  - id: IP-L05
    category: L
    severity: critical
    type: regex
    pattern: '\b(?:confidence|konfidenz|vertrauens)[\s-]*(?:board|tafel|[üu]bersicht)\w*|\btableaux?\s+(?:de|des)\s+(?:confiance|fiabilit[ée])\b|\btablic\w*\s+(?:pewno[sś]ci|zaufania)\b'
    description: "Translated internal dashboard name. Not for external audiences."

  - id: IP-L06
    category: L
    severity: critical
    type: regex
    pattern: '\bkanonisch\w*\s+(?:daten)?modell\w*|\bmod[èe]les?\s+(?:de\s+donn[ée]es\s+)?canoniques?\b|\bmodel\w*\s+kanoniczn\w*|\bcanonical\s+model\b'
    description: "Translated internal framework name. Never share externally."

  - id: IP-L07
    category: L
    severity: high
    type: regex
    pattern: '\bquellen[\s-]*(?:register|verzeichnis)\w*|\bregistre\s+des\s+sources\b|\brejestr\w*\s+[źz]r[óo]de[łl]\w*'
    description: "Translated internal source document name. Reveals the monitoring source network."

  - id: IP-L10
    category: L
    severity: high
    type: regex
    pattern: 'cluster'
    description: "'Cluster' in any language or compound (Funktionscluster, cluster fonctionnel, ERP-Cluster). In public text say 'invoicing function' and its translation."

  - id: IP-L11
    category: L
    severity: high
    type: regex
    pattern: '\bklast(?:er|r)\w*|\bgrappes?\b|\bregroupements?\s+(?:fonctionnels?|de\s+fonctions)\b'
    description: "Polish or French rendering of 'cluster'. Externally say 'invoicing function' and its translation."

  - id: IP-L15
    category: L
    severity: critical
    type: regex
    pattern: '\barbeits[\s-]*paket\w*'
    description: "German rendering of an internal deliverable name. On the page the unit is a work item (Aufgabe)."

  - id: IP-L16
    category: L
    severity: critical
    type: regex
    pattern: '\b(?:lots?|paquets?)\s+de\s+trava(?:il|ux)\b'
    description: "French rendering of an internal deliverable name. On the page the unit is a work item (tâche)."

  - id: IP-L17
    category: L
    severity: critical
    type: regex
    pattern: '\bpakiet\w*\s+(?:robocz\w*|prac\w*|zada[ńn]\w*)'
    description: "Polish rendering of an internal deliverable name. On the page the unit is a work item (zadanie)."

  - id: IP-L20
    category: L
    severity: critical
    type: regex
    pattern: '\bSTCD\d\b|\bFR_B2B(?:_CRN)?\b|\bFRSINV\b|\bEDOC_[A-Z_]+\b|\bBADI_[A-Z0-9_]+\b|\bBAdI\b|\bPROCESS_(?:CALLBACK|AFTER_STATUS_CHANGE)\b|\bEDIFACT_OUT\b|\bVDART\b'
    description: "ERP field, process or enhancement name. Configuration detail never appears in public text, in any language."

  - id: IP-L21
    category: L
    severity: high
    type: regex
    case_sensitive: true
    pattern: '\b(?:VF0[1-4]|VF11|FB60|FB70|MIRO|MIGO|SPRO|SM59|SE1[16]|WE0[2-5]|BD87|SOAMANAGER)\b'
    description: "ERP transaction code. Say what has to be configured, not where."

  - id: IP-L22
    category: L
    severity: critical
    type: regex
    pattern: '\bSAP[\s-]*(?:notes?|hinweis(?:e)?)\s*(?:nr\.?\s*|no\.?\s*|n[°o]\.?\s*)?\d{5,}|\b(?:notes?|nota|hinweis)\s+SAP\s*(?:nr\.?\s*|n[°o]\.?\s*)?\d{5,}'
    description: "Vendor note number, in any language. Configuration detail never appears in public text."

  - id: IP-L23
    category: L
    severity: high
    type: regex
    pattern: '\bglobali[sz]ation\s+studio\b|\bER[\s-]+format[\s-]*mapping\b'
    description: "ERP configuration workspace or sequence. Say what has to be configured, not how."

  - id: IP-L25
    category: L
    severity: critical
    type: regex
    pattern: '\b(?:layer|schicht|couche|warstw\w*)[\s_-]*[1-3]\b'
    description: "Numbered layer label in any language. Reveals internal processing stages."

  - id: IP-L26
    category: L
    severity: medium
    type: regex
    pattern: '\b(?:ebene|niveau|poziom\w*)[\s_-]*[1-3]\b'
    description: "Numbered level label. Ordinary in some sentences, so a warning: check it is not a layer or source grade."

  - id: IP-L27
    category: L
    severity: high
    type: regex
    pattern: '\bquellen?\s+(?:der\s+)?(?:stufe|ebene|klasse|kategorie|rang)\s*[1-3]\b|\b(?:stufe|ebene|klasse)[\s_-]*[1-3][\s-]*quellen?\b|\bsources?\s+de\s+(?:niveau|rang|cat[ée]gorie|classe)\s*[1-3]\b|\b[źz]r[óo]d\w*\s+(?:poziomu|klasy|kategorii|rz[ęe]du)\s*[1-3]\b'
    description: "Translated internal source grading label. Say what the source is instead."

  - id: IP-L28
    category: L
    severity: high
    type: regex
    pattern: '\b(?:wir|unser(?:e|em)?\s+system|einvoiceops)\s+(?:[üu]berwach|ueberwach|scann|crawl|scrap|pars|extrahier|monitor)\w*|\b(?:[üu]berwach|ueberwach|scann|crawl|scrap|extrahier|monitor)\w*\s+wir\b'
    description: "German system-agency verb reveals the internal pipeline. On the page we read sources (lesen)."

  - id: IP-L29
    category: L
    severity: high
    type: regex
    pattern: '\bnous\s+(?:les\s+|la\s+|le\s+|l.)?(?:surveill|scann|crawl|scrap|pars|extray|extrai|d[ée]tect|monitor)\w*|\b(?:notre\s+syst[èe]me|einvoiceops)\s+(?:surveill|scann|crawl|scrap|pars|extrai|d[ée]tect|monitor)\w*'
    description: "French system-agency verb reveals the internal pipeline. On the page we read sources (lisons)."

  - id: IP-L30
    category: L
    severity: high
    type: regex
    pattern: '\b(?:monitorujemy|skanujemy|wykrywamy|parsujemy|ekstrahujemy|crawlujemy|scrapujemy)\b|\bnasz\s+system\s+(?:monitoruje|skanuje|wykrywa)\w*'
    description: "Polish system-agency verb reveals the internal pipeline. On the page we read sources (czytamy)."

  - id: IP-L31
    category: L
    severity: medium
    type: regex
    pattern: '\b(?:[äa]nderungs|aenderungs)[\s-]*erkennung\b|\bd[ée]tection\s+des?\s+(?:changements?|modifications?)\b|\bwykrywani\w*\s+zmian\b'
    description: "Translated monitoring architecture term. Use outcome language instead."

  - id: IP-L32
    category: L
    severity: high
    type: regex
    pattern: '\b(?:monitor\w*|track\w*|[üu]berwach\w*|ueberwach\w*|beobacht\w*|surveill\w*|suiv\w*|monitoruj\w*|[śs]ledz\w*|obserwuj\w*)\s+(?:\w+\s+){0,3}\d+\s+(?:countries|l[äa]nder\w*|laender\w*|pays|kraj\w*|pa[ńn]stw\w*)\b|\b\d+\s+(?:countries|l[äa]nder\w*|laender\w*|pays|kraj\w*|pa[ńn]stw\w*)\s+(?:\w+\s+){0,2}(?:tracked|monitored|watched|[üu]berwacht|beobachtet|surveill[ée]s|suivis|monitorowan\w*|[śs]ledzon\w*|obserwowan\w*)'
    description: "Monitoring scope stated as a country count, in any language. Name the countries a customer buys, not the reach."

  - id: IP-L33
    category: L
    severity: high
    type: regex
    pattern: '\bSP[\s-]+pipelines?\b|\b(?:monitoring|[üu]berwachungs|ueberwachungs|surveillance|veille|monitorowani\w*)[\s-]*pipelines?\b|\bpipelines?\s+(?:de\s+(?:surveillance|veille|signaux)|monitorowani\w*)\b|\bsignal[\s-]*(?:detection|registry|erkennung|erfassung|register)\w*|\b(?:d[ée]tection|registre)\s+(?:de|des)\s+signaux\b|\b(?:wykrywani\w*|rejestr\w*)\s+sygna[łl]\w*'
    description: "Internal monitoring pipeline or signal wording, in any language."

  # Authority claims. The product prepares operations and makes no compliance authority claim,
  # so a guarantee, a legal-compliance promise or an offer of advice is blocked in every language.
  # The line that says we give no advice is allowed; the bare advice nouns are warnings only.

  - id: IP-L40
    category: L
    severity: high
    type: regex
    pattern: '\b(?:legally|certified)\s+compliant\b|\bguarantee[ds]?\b|\bwe\s+(?:provide|offer|give)\s+(?:\w+\s+){0,2}(?:legal|tax)\s+advice\b|\bour\s+(?:legal|tax)\s+advice\b'
    description: "Compliance authority claim or offer of advice. State what we send and where it says so."

  - id: IP-L41
    category: L
    severity: high
    type: regex
    pattern: '\bgarantier\w*|\bgarantie\w*|\brechts[\s-]*(?:sicher|konform)\w*|\b(?:gesetzes|gobd|steuer)[\s-]*konform\w*|\bgesetzlich\w*\s+konform\w*|\bzertifiziert\w*\s+(?:konform|compliant)\w*|\b(?:konformit[äa]t|compliance)\s+(?:ist\s+|wird\s+)?(?:gew[äa]hrleistet|zugesichert|sichergestellt)\b|\bbeglaubigt\w*|\b(?:unser\w*\s+|wir\s+(?:bieten|leisten|erbringen|geben)\w*\s+(?:(?!kein|nicht)\w+\s+){0,2})(?:rechts|steuer)(?:[\s-]+(?:oder|und)\s+steuer)?[\s-]*beratung\w*|\bwir\s+beraten\s+(?:sie\s+)?(?:rechtlich|steuerlich)\w*'
    description: "German compliance authority claim, certified-copy claim or offer of advice (garantiert, rechtssicher, rechtskonform). State what we send and where it says so."

  - id: IP-L42
    category: L
    severity: medium
    type: regex
    pattern: '\bgew(?:ä|a|ae)hrleist\w*|\b(?:rechts|steuer)[\s-]*beratung\w*|\brechts[\s-]*verbindlich\w*'
    description: "German wording close to an authority claim. Expected once in the line that says we give no advice; anywhere else, rephrase."

  - id: IP-L43
    category: L
    severity: high
    type: regex
    pattern: '\bgarant(?:i|ie|ies|is|ir|issons|issent|issez|it|issant)\b|\bconformes?\s+[àa]\s+la\s+(?:loi|r[ée]glementation|l[ée]gislation)\b|\bl[ée]galement\s+conformes?\b|\bconformit[ée]\s+(?:l[ée]gale|r[ée]glementaire|garantie|assur[ée]e|certifi[ée]e)\b|\bcertifi[ée]e?s?\s+conformes?\b|\ben\s+r[èe]gle\s+avec\s+(?:la\s+loi|le\s+fisc)\b|\b(?:nos|notre)\s+conseils?\s+(?:juridiques?|fiscaux|fiscal)\b|\bnous\s+(?:vous\s+)?(?:fournissons|offrons|apportons|donnons|proposons|assurons)\s+(?:(?!pas\b|aucun)\w+\s+){0,2}(?:conseils?|avis)\s+(?:juridiques?|fiscaux|fiscal)'
    description: "French compliance authority claim, certified-copy claim or offer of advice (garanti, conforme à la loi). State what we send and where it says so."

  - id: IP-L44
    category: L
    severity: medium
    type: regex
    pattern: '\b(?:conseils?|avis)\s+(?:juridiques?|fiscaux|fiscal)\b'
    description: "French advice wording. Expected once in the line that says we give no advice; anywhere else, rephrase."

  - id: IP-L45
    category: L
    severity: high
    type: regex
    pattern: '\bgwarant\w*|\bgwarancj\w*|\bzgodn\w*\s+z\s+prawem\b|\bprawnie\s+zgodn\w*|\bzgodno[sś][cć]\w*\s+(?:z\s+prawem|prawn\w*|certyfikowan\w*|zapewnion\w*)|\bcertyfikowan\w*\s+zgodno[sś][cć]\w*|(?<!nie )\bzapewniamy\s+zgodno[sś][cć]\w*|\b(?:uwierzytelnion|po[śs]wiadczon)\w*\s+(?:kopi|odpis)\w*|\b(?:kopi|odpis)\w*\s+(?:uwierzytelnion|po[śs]wiadczon)\w*|\bnasz\w*\s+(?:doradztw\w*|porad\w*)\s+(?:prawn\w*|podatkow\w*)|(?<!nie )\b(?:udzielamy|[śs]wiadczymy|oferujemy|zapewniamy)\s+(?:\w+\s+){0,2}(?:doradztw\w*|porad\w*)\s+(?:prawn\w*|podatkow\w*)'
    description: "Polish compliance authority claim, certified-copy claim or offer of advice (gwarantowane, zgodny z prawem). State what we send and where it says so."

  - id: IP-L46
    category: L
    severity: medium
    type: regex
    pattern: '\bzgodn\w*\s+z\s+przepisami\b|\b(?:doradztw\w*|porad\w*)\s+(?:prawn\w*|podatkow\w*)'
    description: "Polish wording close to an authority claim. Expected once in the line that says we give no advice; anywhere else, rephrase."


# Path rules: a file or folder that may not exist in the repository, whatever it contains.
# A path that git ignores and does not track (the local link to the open-items list) is let
# through in a working checkout, because it cannot be pushed. In CI it never exists.
path_rules:
  - id: IP-P01
    severity: critical
    regex: '^src/content/research(?:/|$)'
    description: "The internal open-items list is kept outside this repository. Remove the folder and keep the ignore line."

  - id: IP-P02
    severity: critical
    regex: '^(?:src/pages/(?:status|cockpit)\.astro|evidence(?:/|$)|public/p(?:/|$))'
    description: "Local-only page or working data that is never deployed."


exceptions:
  # Every exception names the rule it relaxes. The scanner refuses a file in which one does not.
  # Exceptions that matched nothing (citation wording, approved vocabulary, a corrected
  # tool-name line) were removed 2026-10-16: an exception that suppresses nothing today can
  # only hide a leak tomorrow.
  - pattern: "manual queue management"
    rule: IP-B08
    reason: "Describes the customer email fallback process in DE.md body, not our internal backend"
  - regex: "work items in each cluster vary by ERP system"
    mask: true
    rule: IP-L10
    path_prefix: "src/content/countries/"
    reason: "The approved closing sentence of the older country pages, already a warning under IP-D09"
  - regex: "verifiable provenance"
    mask: true
    rule: IP-L03
    path: "src/content/countries/FR.md"
    reason: "English archiving wording on the France country page, not the system name"
